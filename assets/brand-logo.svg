<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="argon-pc-subagent logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="glassTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Square Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Argon Octagonal Frame -->
  <polygon
    points="182,78 330,78 434,182 434,330 330,434 182,434 78,330 78,182"
    fill="none"
    stroke="url(#cyanViolet)"
    stroke-width="8"
    stroke-linejoin="round"
    opacity="0.85"
    filter="url(#glow)"
  />
  <polygon
    points="192,98 320,98 414,192 414,320 320,414 192,414 98,320 98,192"
    fill="none"
    stroke="#334155"
    stroke-width="1.5"
    stroke-dasharray="6 8"
    opacity="0.7"
  />

  <!-- Left Terminal Glass Tile -->
  <rect x="108" y="198" width="116" height="116" rx="24" fill="url(#glassTile)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2.5"/>
  <!-- Prompt >_ -->
  <path d="M 136 238 L 162 256 L 136 274" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="168" y1="276" x2="196" y2="276" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Bridge Streams -->
  <path d="M 224 244 C 248 214, 268 298, 294 256" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <path d="M 224 268 C 250 296, 268 216, 294 256" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <circle cx="259" cy="256" r="6" fill="#F8FAFC" filter="url(#glow)"/>

  <!-- Right 4-Point Gemini Star -->
  <path
    d="M 346 184
       C 350 226, 364 242, 408 256
       C 364 270, 350 286, 346 328
       C 342 286, 328 270, 284 256
       C 328 242, 342 226, 346 184 Z"
    fill="url(#cyanViolet)"
    filter="url(#glow)"
  />
  <path
    d="M 346 212
       C 348 236, 356 246, 382 256
       C 356 266, 348 276, 346 300
       C 344 276, 336 266, 310 256
       C 336 246, 344 236, 346 212 Z"
    fill="#E0F2FE"
    opacity="0.7"
  />
</svg>
