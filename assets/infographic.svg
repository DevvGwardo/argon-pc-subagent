<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1240" width="960" height="1240" role="img" aria-label="argon-pc-subagent architecture and security infographic">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151E32"/>
      <stop offset="100%" stop-color="#101829"/>
    </linearGradient>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="1240" fill="url(#canvasBg)"/>

  <!-- Subtle Top Glow -->
  <ellipse cx="480" cy="80" rx="420" ry="120" fill="#22D3EE" opacity="0.06"/>

  <!-- Header -->
  <rect x="275" y="42" width="410" height="30" rx="15" fill="#162238" stroke="#22D3EE" stroke-opacity="0.45"/>
  <text x="480" y="62" text-anchor="middle" fill="#22D3EE" font-size="12" font-weight="700" letter-spacing="1.5" class="font">WINDOWS SUBAGENT BRIDGE • SUBSCRIPTION-FIRST</text>

  <text x="480" y="118" text-anchor="middle" fill="#F8FAFC" font-size="44" font-weight="800" class="font">argon-pc-subagent</text>
  <text x="480" y="150" text-anchor="middle" fill="#94A3B8" font-size="17" font-weight="500" class="font">Connects Google Antigravity to Gemini 4 Argon via Desktop App or CLI</text>
  <rect x="330" y="168" width="300" height="3" rx="1.5" fill="url(#accentBar)"/>

  <!-- SECTION 1: Preflight -->
  <rect x="60" y="196" width="840" height="202" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>
  <circle cx="98" cy="236" r="16" fill="#22D3EE"/>
  <text x="98" y="242" text-anchor="middle" fill="#090E1A" font-size="16" font-weight="800" class="font">1</text>
  <text x="128" y="242" fill="#F8FAFC" font-size="22" font-weight="700" class="font">Preflight Environment Check</text>
  <rect x="656" y="220" width="218" height="32" rx="8" fill="#0B1220" stroke="#334155"/>
  <text x="765" y="241" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="600" class="mono">scripts/check_status.mjs</text>

  <!-- Step 1 Sub-cards -->
  <rect x="86" y="274" width="248" height="98" rx="12" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.35"/>
  <text x="106" y="305" fill="#22D3EE" font-size="15" font-weight="700" class="font">Gemini Desktop App</text>
  <text x="106" y="330" fill="#CBD5E1" font-size="13" class="font">Inspects Gemini.exe processes</text>
  <text x="106" y="350" fill="#94A3B8" font-size="13" class="font">&amp; live desktop window handles</text>

  <rect x="356" y="274" width="248" height="98" rx="12" fill="#0B1220" stroke="#6366F1" stroke-opacity="0.4"/>
  <text x="376" y="305" fill="#818CF8" font-size="15" font-weight="700" class="font">cua-driver Bridge</text>
  <text x="376" y="330" fill="#CBD5E1" font-size="13" class="font">Verifies daemon pipe &amp; queries</text>
  <text x="376" y="350" fill="#94A3B8" font-size="13" class="font">cross-session GUI windows</text>

  <rect x="626" y="274" width="248" height="98" rx="12" fill="#0B1220" stroke="#A855F7" stroke-opacity="0.4"/>
  <text x="646" y="305" fill="#C084FC" font-size="15" font-weight="700" class="font">Antigravity CLI (agy)</text>
  <text x="646" y="330" fill="#CBD5E1" font-size="13" class="font">Lists signed-in CLI models</text>
  <text x="646" y="350" fill="#94A3B8" font-size="13" class="font">&amp; checks Argon availability</text>

  <!-- Connector 1 -> 2 -->
  <line x1="480" y1="398" x2="480" y2="430" stroke="#22D3EE" stroke-width="3"/>
  <polygon points="472,428 488,428 480,440" fill="#22D3EE"/>

  <!-- SECTION 2: Two-Tier Routing -->
  <rect x="60" y="444" width="840" height="352" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>
  <circle cx="98" cy="484" r="16" fill="#6366F1"/>
  <text x="98" y="490" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="800" class="font">2</text>
  <text x="128" y="490" fill="#F8FAFC" font-size="22" font-weight="700" class="font">Two-Tier Subscription Routing</text>
  <rect x="642" y="468" width="232" height="32" rx="8" fill="#0B1220" stroke="#334155"/>
  <text x="758" y="489" text-anchor="middle" fill="#A5B4FC" font-size="14" font-weight="600" class="mono">scripts/delegate_argon.mjs</text>

  <!-- Tier 1 Card -->
  <rect x="86" y="520" width="380" height="248" rx="14" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="106" y="538" width="136" height="24" rx="12" fill="#0E7490" fill-opacity="0.35"/>
  <text x="174" y="555" text-anchor="middle" fill="#22D3EE" font-size="12" font-weight="700" class="font">TIER 1 • PRIMARY</text>
  <text x="106" y="590" fill="#F8FAFC" font-size="20" font-weight="700" class="font">Gemini Desktop App</text>
  <text x="106" y="614" fill="#94A3B8" font-size="13" class="font">Runs on your Gemini subscription via cua-driver</text>
  <line x1="106" y1="632" x2="446" y2="632" stroke="#1E293B" stroke-width="1.5"/>
  <text x="106" y="658" fill="#CBD5E1" font-size="12.5" class="font">1. Locate HWND via stdin-piped list_windows</text>
  <text x="106" y="684" fill="#CBD5E1" font-size="12.5" class="font">2. Capture state &amp; screenshot (get_window_state)</text>
  <text x="106" y="710" fill="#CBD5E1" font-size="12.5" class="font">3. Pack filtered source context (--pack-only)</text>
  <text x="106" y="736" fill="#CBD5E1" font-size="12.5" class="font">4. Verify Argon model &amp; confirm before input</text>

  <!-- Tier 2 Card -->
  <rect x="494" y="520" width="380" height="248" rx="14" fill="#0B1220" stroke="#A855F7" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="514" y="538" width="144" height="24" rx="12" fill="#6B21A8" fill-opacity="0.35"/>
  <text x="586" y="555" text-anchor="middle" fill="#C084FC" font-size="12" font-weight="700" class="font">TIER 2 • FALLBACK</text>
  <text x="514" y="590" fill="#F8FAFC" font-size="20" font-weight="700" class="font">Antigravity CLI (agy)</text>
  <text x="514" y="614" fill="#94A3B8" font-size="13" class="font">Non-interactive headless delegation when GUI is closed</text>
  <line x1="514" y1="632" x2="854" y2="632" stroke="#1E293B" stroke-width="1.5"/>
  <text x="514" y="658" fill="#CBD5E1" font-size="12.5" class="font">1. Sets cwd &amp; --add-dir to target folder</text>
  <text x="514" y="684" fill="#CBD5E1" font-size="12.5" class="font">2. Runs agy -p --mode plan --output-format json</text>
  <text x="514" y="710" fill="#CBD5E1" font-size="12.5" class="font">3. Avoids --effort conflicts on suffixed models</text>
  <text x="514" y="736" fill="#CBD5E1" font-size="12.5" class="font">4. Zero silent model swaps (explicit opt-in only)</text>

  <!-- Connector 2 -> 3 -->
  <line x1="480" y1="796" x2="480" y2="828" stroke="#10B981" stroke-width="3"/>
  <polygon points="472,826 488,826 480,838" fill="#10B981"/>

  <!-- SECTION 3: Security Guardrails -->
  <rect x="60" y="842" width="840" height="278" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>
  <circle cx="98" cy="882" r="16" fill="#10B981"/>
  <text x="98" y="888" text-anchor="middle" fill="#090E1A" font-size="16" font-weight="800" class="font">3</text>
  <text x="128" y="888" fill="#F8FAFC" font-size="22" font-weight="700" class="font">Built-In Security &amp; Reliability Guardrails</text>

  <!-- 2x2 Grid -->
  <rect x="86" y="918" width="380" height="82" rx="12" fill="#0B1220" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="108" y="948" fill="#34D399" font-size="15" font-weight="700" class="font">Secret Exclusion</text>
  <text x="108" y="974" fill="#94A3B8" font-size="12.5" class="font">Skips .env*, .npmrc, *.key, *.pem &amp; service JSON</text>

  <rect x="494" y="918" width="380" height="82" rx="12" fill="#0B1220" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="516" y="948" fill="#34D399" font-size="15" font-weight="700" class="font">Symlink &amp; Junction Block</text>
  <text x="516" y="974" fill="#94A3B8" font-size="12.5" class="font">Uses fs.lstatSync to block reparse boundary escapes</text>

  <rect x="86" y="1014" width="380" height="82" rx="12" fill="#0B1220" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="108" y="1044" fill="#34D399" font-size="15" font-weight="700" class="font">Binary &amp; Noise Filtering</text>
  <text x="108" y="1070" fill="#94A3B8" font-size="12.5" class="font">Skips .git, node_modules, dist &amp; NUL-byte files</text>

  <rect x="494" y="1014" width="380" height="82" rx="12" fill="#0B1220" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="516" y="1044" fill="#34D399" font-size="15" font-weight="700" class="font">Strict Caps &amp; Clean Exits</text>
  <text x="516" y="1070" fill="#94A3B8" font-size="12.5" class="font">Finite byte caps, System32 paths &amp; AbortController</text>

  <!-- Footer -->
  <rect x="60" y="1144" width="840" height="58" rx="12" fill="#0B1220" stroke="#334155"/>
  <text x="480" y="1178" text-anchor="middle" fill="#CBD5E1" font-size="14" font-weight="600" class="font">Install with <tspan fill="#22D3EE" class="mono">./install.ps1</tspan> • Zero API keys required in subscription-first mode • MIT License</text>
</svg>
